# Royal Korutla - Netlify Deployment Configuration

[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

[context.deploy-preview.environment]
  # Suppress the Collaborative Deploy Preview feedback drawer on PR previews
  NETLIFY_FEEDBACK_DISABLED = "true"
